<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1050" viewBox="0 0 1200 1050" role="img" aria-labelledby="title desc">
  <title id="title">EvidScope evidence architecture</title>
  <desc id="desc">Business execution stays outside the audit path. Agent, tool and policy sources submit authenticated metadata to the Vault through an ingestion gateway. The Vault stores a signed ledger and rebuildable projections. A separate worker computes deterministic findings, people review them, and the Vault produces a signed export. An independent verifier checks that export with a separately trusted public key and checkpoint. Observation does not block execution and cryptographic integrity does not prove that a source is truthful.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1l8 4-8 4" fill="none" stroke="#597084" stroke-width="1.5"/></marker>
    <marker id="teal-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1l8 4-8 4" fill="none" stroke="#128772" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1200" height="1050" rx="24" fill="#f3f6fa"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="48" y="53" fill="#127b69" font-size="13" font-weight="700" letter-spacing="2.5">FROM ACTION TO AUDIT EVIDENCE</text>
    <text x="48" y="98" fill="#12273b" font-size="34" font-weight="700">Observe separately. Verify independently.</text>
    <text x="48" y="130" fill="#596c7e" font-size="17">Execution, evidence storage, analysis, and trust have distinct responsibilities.</text>

    <rect x="48" y="161" width="1104" height="102" rx="14" fill="#e8edf4" stroke="#cbd5e1"/>
    <text x="70" y="189" fill="#5c6e80" font-size="12" font-weight="700" letter-spacing="1.5">BUSINESS EXECUTION / EXTERNAL SYSTEMS</text>
    <text x="75" y="233" fill="#273e54" font-size="21" font-weight="600">AI agent</text>
    <path d="M183 226H290" stroke="#597084" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="314" y="233" fill="#273e54" font-size="21" font-weight="600">Tool or service</text>
    <path d="M491 226H598" stroke="#597084" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="622" y="233" fill="#273e54" font-size="21" font-weight="600">Business outcome</text>
    <text x="910" y="225" fill="#596c7e" font-size="15">No inline blocking</text>
    <text x="910" y="246" fill="#596c7e" font-size="13">Audit is an observation path.</text>
    <path d="M220 264V324" stroke="#597084" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
    <text x="240" y="300" fill="#5b7184" font-size="14">Asynchronous evidence</text>

    <rect x="48" y="325" width="310" height="155" rx="14" fill="#fff" stroke="#cbd5e1"/>
    <text x="70" y="355" fill="#127b69" font-size="12" font-weight="700" letter-spacing="1.4">01 / SOURCE RECORDS</text>
    <text x="70" y="391" fill="#12273b" font-size="22" font-weight="700">Agent · tool · policy</text>
    <text x="70" y="423" fill="#596c7e" font-size="16">Claims, outcomes, authority</text>
    <text x="70" y="451" fill="#596c7e" font-size="16">Provenance stays explicit.</text>

    <path d="M359 402H420" stroke="#597084" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="422" y="325" width="310" height="155" rx="14" fill="#fff" stroke="#cbd5e1"/>
    <text x="444" y="355" fill="#127b69" font-size="12" font-weight="700" letter-spacing="1.4">02 / INGESTION</text>
    <text x="444" y="391" fill="#12273b" font-size="22" font-weight="700">Gateway → Vault API</text>
    <text x="444" y="423" fill="#596c7e" font-size="16">Source auth · nonce · allowlist</text>
    <text x="444" y="451" fill="#596c7e" font-size="16">Metadata-only acceptance</text>

    <path d="M733 402H794" stroke="#597084" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="796" y="325" width="356" height="230" rx="14" fill="#11283d"/>
    <text x="818" y="355" fill="#68dfca" font-size="12" font-weight="700" letter-spacing="1.4">03 / VAULT TRUST BOUNDARY</text>
    <text x="818" y="391" fill="#f4f8fc" font-size="22" font-weight="700">Signed evidence ledger</text>
    <text x="818" y="423" fill="#bed1e1" font-size="16">SQLite transaction · encrypted events</text>
    <text x="818" y="451" fill="#bed1e1" font-size="16">Hash chain · Ed25519 checkpoint</text>
    <path d="M818 473H1130" stroke="#3c576e"/>
    <text x="818" y="500" fill="#bed1e1" font-size="16">Rebuildable search projections</text>
    <text x="818" y="530" fill="#68dfca" font-size="14" font-weight="600">202 response only after commit</text>

    <path d="M974 556V607H733" fill="none" stroke="#597084" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="825" y="594" fill="#596c7e" font-size="14">Leased snapshot</text>
    <rect x="422" y="538" width="310" height="155" rx="14" fill="#fff" stroke="#cbd5e1"/>
    <text x="444" y="568" fill="#127b69" font-size="12" font-weight="700" letter-spacing="1.4">04 / ANALYSIS WORKER</text>
    <text x="444" y="604" fill="#12273b" font-size="22" font-weight="700">Reconcile the evidence</text>
    <text x="444" y="636" fill="#596c7e" font-size="16">Deterministic rules · version checks</text>
    <text x="444" y="664" fill="#596c7e" font-size="16">Findings committed through Vault</text>

    <path d="M421 614H360" stroke="#597084" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="48" y="538" width="310" height="155" rx="14" fill="#fff8e9" stroke="#dec48a"/>
    <text x="70" y="568" fill="#89621b" font-size="12" font-weight="700" letter-spacing="1.4">05 / HUMAN REVIEW</text>
    <text x="70" y="604" fill="#12273b" font-size="22" font-weight="700">Investigate &amp; assess</text>
    <text x="70" y="636" fill="#675d46" font-size="16">Cases · exceptions · governance</text>
    <text x="70" y="664" fill="#675d46" font-size="16">Judgment remains with people.</text>

    <path d="M203 694V741H350V790" fill="none" stroke="#597084" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="67" y="768" fill="#596c7e" font-size="14">Review recorded in Vault</text>
    <path d="M1120 556V764H493V790" fill="none" stroke="#597084" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="854" y="739" fill="#596c7e" font-size="14">Vault produces the export</text>

    <rect x="48" y="792" width="462" height="132" rx="14" fill="#fff" stroke="#cbd5e1"/>
    <text x="70" y="822" fill="#127b69" font-size="12" font-weight="700" letter-spacing="1.4">06 / SIGNED AUDIT REPORT</text>
    <text x="70" y="858" fill="#12273b" font-size="22" font-weight="700">Portable evidence export</text>
    <text x="70" y="891" fill="#596c7e" font-size="16">Ledger · checkpoint · disclosed metadata</text>

    <path d="M511 853H585" stroke="#128772" stroke-width="2" marker-end="url(#teal-arrow)"/>
    <rect x="588" y="792" width="270" height="132" rx="14" fill="#e4f4ef" stroke="#85b9aa"/>
    <text x="610" y="822" fill="#127b69" font-size="12" font-weight="700" letter-spacing="1.4">07 / INDEPENDENT CHECK</text>
    <text x="610" y="858" fill="#12273b" font-size="22" font-weight="700">CLI verifier</text>
    <text x="610" y="890" fill="#406e62" font-size="15">Integrity · order · completeness</text>

    <rect x="911" y="792" width="241" height="132" rx="14" fill="#edf3fb" stroke="#a1b9d6" stroke-dasharray="5 4"/>
    <text x="931" y="822" fill="#46698e" font-size="12" font-weight="700" letter-spacing="1">SEPARATE TRUST ANCHOR</text>
    <text x="931" y="858" fill="#12273b" font-size="20" font-weight="700">Trusted public key</text>
    <text x="931" y="890" fill="#596c7e" font-size="16">+ external checkpoint</text>
    <path d="M910 853H860" stroke="#128772" stroke-width="2" marker-end="url(#teal-arrow)"/>

    <path d="M48 965H1152" stroke="#ccd6e2"/>
    <circle cx="56" cy="998" r="5" fill="#bd9044"/>
    <text x="74" y="1004" fill="#596c7e" font-size="16">Integrity proves the records stayed intact. It does not prove a source told the truth.</text>
  </g>
</svg>
