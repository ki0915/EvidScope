<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">EvidScope — AI audit evidence and governance</title>
  <desc id="desc">EvidScope connects observed AI actions to verifiable evidence and human judgment. Four stages: observe, reconcile, review, and verify. A portfolio prototype for audit evidence and governance.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1423"/><stop offset="1" stop-color="#14273a"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#57e5cb"/><stop offset="1" stop-color="#8ac2ff"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#9ec7df" stroke-opacity=".045"/></pattern>
  </defs>
  <rect width="1200" height="520" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="520" rx="24" fill="url(#grid)"/>
  <path d="M56 58h38" stroke="#57e5cb" stroke-width="4"/>
  <text x="108" y="64" fill="#a5bdd0" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" letter-spacing="2.7">AI AUDIT EVIDENCE / GOVERNANCE</text>
  <rect x="945" y="40" width="199" height="35" rx="17.5" fill="#223448" stroke="#3c5167"/>
  <circle cx="966" cy="57.5" r="4" fill="#f1c777"/>
  <text x="981" y="63" fill="#d6e2ed" font-family="Segoe UI,Arial,sans-serif" font-size="12" letter-spacing="1.3">PORTFOLIO PROTOTYPE</text>
  <text x="55" y="175" fill="#f4f8fc" font-family="Segoe UI,Arial,sans-serif" font-size="78" font-weight="700" letter-spacing="-3">EvidScope</text>
  <text x="59" y="224" fill="#c7d7e6" font-family="Segoe UI,Arial,sans-serif" font-size="26">AI actions. Verifiable evidence. Human judgment.</text>
  <text x="59" y="264" fill="#8fa9bf" font-family="Segoe UI,Arial,sans-serif" font-size="17">Trace what happened. Reconcile the records. Preserve the review.</text>
  <g transform="translate(1000 165)" fill="none">
    <circle r="56" stroke="#365166" stroke-width="1"/>
    <circle r="36" stroke="#57e5cb" stroke-width="1.5"/>
    <path d="M-75 0H75M0-75V75" stroke="#365166"/>
    <path d="M-15 1l10 10 24-25" stroke="#57e5cb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="48" cy="-29" r="5" fill="#f1c777" stroke="#14273a" stroke-width="3"/>
  </g>
  <path d="M58 313H1142" stroke="#32485d"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="58" y="357" fill="#57e5cb" font-size="13" font-weight="700" letter-spacing="2">01 / OBSERVE</text>
    <text x="58" y="393" fill="#f4f8fc" font-size="22" font-weight="600">Independent records</text>
    <text x="58" y="422" fill="#91aabd" font-size="16">Agents · tools · policy sources</text>
    <text x="345" y="357" fill="#57e5cb" font-size="13" font-weight="700" letter-spacing="2">02 / RECONCILE</text>
    <text x="345" y="393" fill="#f4f8fc" font-size="22" font-weight="600">Evidence in context</text>
    <text x="345" y="422" fill="#91aabd" font-size="16">Authority · outcomes · versions</text>
    <text x="631" y="357" fill="#f1c777" font-size="13" font-weight="700" letter-spacing="2">03 / REVIEW</text>
    <text x="631" y="393" fill="#f4f8fc" font-size="22" font-weight="600">Human judgment</text>
    <text x="631" y="422" fill="#91aabd" font-size="16">Findings · cases · governance</text>
    <text x="915" y="357" fill="#8ac2ff" font-size="13" font-weight="700" letter-spacing="2">04 / VERIFY</text>
    <text x="915" y="393" fill="#f4f8fc" font-size="22" font-weight="600">Portable proof</text>
    <text x="915" y="422" fill="#91aabd" font-size="16">Signed export · external trust</text>
  </g>
  <path d="M58 475H1142" stroke="url(#accent)" stroke-width="2"/>
</svg>
